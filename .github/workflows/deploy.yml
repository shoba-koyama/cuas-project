name: Deploy to Lolipop (FTP)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LOLLIPOP_FTP_SERVER }}
          username: ${{ secrets.LOLLIPOP_FTP_USER }}
          password: ${{ secrets.LOLLIPOP_FTP_PASSWORD }}
          server-dir: ${{ secrets.LOLLIPOP_REMOTE_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/old_*/**
            **/.DS_Store
